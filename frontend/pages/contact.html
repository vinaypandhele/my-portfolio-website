<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Vinnuu PDF Tech</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo"><h1>Vinnuu<span class="logo-accent">PDF</span></h1></div>
                <div class="nav-menu"><a href="../index.html" class="nav-link">Home</a></div>
                <div class="nav-actions">
                    <button class="theme-toggle" id="themeToggle"><span class="theme-icon">🌙</span></button>
                </div>
            </div>
        </div>
    </nav>

    <section style="padding: 60px 0; background: linear-gradient(135deg, var(--primary-light) 0%, var(--white) 100%);">
        <div class="container">
            <h1 style="font-size: var(--font-size-4xl); color: var(--primary-dark); text-align: center; margin-bottom: 40px;">Contact Us</h1>
            
            <div style="max-width: 600px; margin: 0 auto;">
                <form style="background: var(--white); padding: 30px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; color: var(--gray-700); font-weight: 600;">Name</label>
                        <input type="text" placeholder="Your Name" style="width: 100%; padding: 10px; border: 2px solid var(--gray-200); border-radius: var(--radius-lg); font-family: var(--font-family);">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; color: var(--gray-700); font-weight: 600;">Email</label>
                        <input type="email" placeholder="your@email.com" style="width: 100%; padding: 10px; border: 2px solid var(--gray-200); border-radius: var(--radius-lg); font-family: var(--font-family);">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; color: var(--gray-700); font-weight: 600;">Message</label>
                        <textarea placeholder="Your message..." rows="5" style="width: 100%; padding: 10px; border: 2px solid var(--gray-200); border-radius: var(--radius-lg); font-family: var(--font-family);"></textarea>
                    </div>
                    <button type="submit" style="width: 100%; padding: 12px; background: var(--primary-blue); color: var(--white); border: none; border-radius: var(--radius-lg); font-weight: 600; cursor: pointer;">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Vinnuu PDF Tech. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/theme.js"></script>
</body>
</html>
